<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 따뜻한 말벗 & 복지 상담소</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      background: linear-gradient(135deg, #e3f2fd, #e8f5e9);
      font-family: 'Malgun Gothic', sans-serif;
    }
    .app-container {
      width: 400px; max-width: 90%; height: 600px;
      padding: 24px; border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.18);
      display: flex; flex-direction: column;
    }
    h1 {
      margin: 0 0 16px; text-align: center; font-size: 22px; color: #2e7d32;
    }
    /* 로그인 화면 */
    #login-screen {
      display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%;
    }
    .login-btn {
      padding: 12px 24px; font-size: 18px; border: none; border-radius: 14px;
      background: #4285f4; color: white; cursor: pointer; transition: 0.2s;
    }
    .login-btn:hover { background: #3367d6; }
    
    /* 메인 채팅 화면 */
    #chat-screen {
      display: none; flex-direction: column; height: 100%;
    }
    .chat-box {
      flex: 1; overflow-y: auto; background: #f4f6f8; border-radius: 14px;
      padding: 16px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .message {
      padding: 12px 16px; border-radius: 14px; font-size: 16px; line-height: 1.4; max-width: 80%;
    }
    .msg-user {
      background: #c8e6c9; align-self: flex-end; color: #1b5e20;
    }
    .msg-ai {
      background: #ffffff; align-self: flex-start; color: #333; border: 1px solid #ddd;
    }
    .input-area {
      display: flex; gap: 10px;
    }
    #user-input {
      flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 14px;
      font-size: 16px; outline: none;
    }
    .send-btn {
      padding: 0 20px; border: none; border-radius: 14px;
      background: #2e7d32; color: white; font-size: 16px; cursor: pointer; font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <h1>🌱 따뜻한 AI 말벗</h1>

    <div id="login-screen">
      <p style="text-align:center; color:#555; margin-bottom: 20px;">
        어르신들의 든든한 친구이자<br>맞춤형 복지 안내원입니다.
      </p>
      <button class="login-btn" id="loginBtn">구글 계정으로 시작하기</button>
    </div>

    <div id="chat-screen">
      <div class="chat-box" id="chatBox">
        <div class="message msg-ai">안녕하세요! 오늘 하루는 어떠셨나요? 복지 혜택에 대해 궁금한 점이 있으시다면 편하게 말씀해주세요.</div>
      </div>
      <div class="input-area">
        <input type="text" id="user-input" placeholder="여기에 말씀해 주세요..." />
        <button class="send-btn" id="sendBtn">전송</button>
      </div>
    </div>
  </div>

  <script type="module">
    // 1. Firebase SDK 임포트
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // [주의] 본인의 Firebase 설정 객체로 교체하세요!
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_ID",
      appId: "YOUR_APP_ID"
    };

    // [주의] 본인의 생성형 AI (예: OpenAI) API 키로 교체하세요!
    const AI_API_KEY = "YOUR_OPENAI_API_KEY"; 

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // DOM 요소
    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const loginBtn = document.getElementById('loginBtn');
    const sendBtn = document.getElementById('sendBtn');
    const userInput = document.getElementById('user-input');
    const chatBox = document.getElementById('chatBox');

    let currentUser = null;

    // 2. Firebase Authentication (로그인)
    loginBtn.addEventListener('click', () => {
      signInWithPopup(auth, provider).catch(error => {
        console.error("로그인 에러:", error);
        alert("로그인에 실패했습니다.");
      });
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        loginScreen.style.display = 'none';
        chatScreen.style.display = 'flex';
      } else {
        currentUser = null;
        loginScreen.style.display = 'flex';
        chatScreen.style.display = 'none';
      }
    });

    // 3. 메세지 전송 및 AI 연동
    sendBtn.addEventListener('click', async () => {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      userInput.value = '';

      // Firebase Firestore에 사용자 질문 저장 (데이터 연동)
      if (currentUser) {
        try {
          await addDoc(collection(db, "chats"), {
            uid: currentUser.uid,
            message: text,
            sender: 'user',
            timestamp: serverTimestamp()
          });
        } catch (e) {
          console.error("DB 저장 에러:", e);
        }
      }

      // 생성형 AI API 호출 (OpenAI 예시)
      // 실제 서비스 시에는 클라이언트에서 API 키를 직접 호출하기보다 백엔드를 거치는 것이 안전합니다.
      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${AI_API_KEY}`
          },
          body: JSON.stringify({
            model: "gpt-3.5-turbo",
            messages: [
              { role: "system", content: "당신은 따뜻하고 친절한 사회복지사 및 노인 심리 상담사입니다. 노인분들이 이해하기 쉽도록 친절하고, 너무 길지 않게 답변해주세요." },
              { role: "user", content: text }
            ]
          })
        });

        if(!response.ok) throw new Error("API 요청 실패");
        
        const data = await response.json();
        const aiText = data.choices[0].message.content;

        appendMessage(aiText, 'ai');
        playTTS(aiText); // 4. TTS 기능 실행

        // AI 답변 DB 저장
        if (currentUser) {
          await addDoc(collection(db, "chats"), {
            uid: currentUser.uid,
            message: aiText,
            sender: 'ai',
            timestamp: serverTimestamp()
          });
        }

      } catch (error) {
        console.error(error);
        const errorMsg = "죄송합니다. 현재 AI 서버와 연결할 수 없습니다.";
        appendMessage(errorMsg, 'ai');
        playTTS(errorMsg);
      }
    });

    // 엔터키로 전송
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });

    // 화면에 메세지 추가 함수
    function appendMessage(text, sender) {
      const div = document.createElement('div');
      div.classList.add('message', sender === 'user' ? 'msg-user' : 'msg-ai');
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 5. TTS (Text-to-Speech) 기능
    function playTTS(text) {
      if (!window.speechSynthesis) {
        console.warn("이 브라우저는 TTS를 지원하지 않습니다.");
        return;
      }
      // 실행 중인 음성이 있다면 취소
      window.speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = 0.9; // 어르신을 위해 조금 천천히 읽기
      utterance.pitch = 1.0;
      
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>

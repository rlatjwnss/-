<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 응급처치 도우미</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #bbdefb);
      font-family: 'Malgun Gothic', sans-serif; color: #333;
    }
    .container {
      width: min(900px, 92%); margin: 40px auto;
      background: #fff; border-radius: 20px;
      padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; color: #d32f2f; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #555; margin-bottom: 20px; font-size: 15px; }
    
    .warning-notice {
      background: #ffebee; border-left: 5px solid #d32f2f; color: #c62828;
      padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 30px; line-height: 1.5;
    }

    /* 공통 폼 스타일 */
    input, textarea {
      padding: 14px; border: 1px solid #ccc; border-radius: 10px;
      font-size: 15px; outline: none; width: 100%; font-family: inherit;
    }
    input:focus, textarea:focus { border-color: #1976d2; box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1); }
    button {
      border: none; border-radius: 10px; padding: 14px 20px;
      font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    button:hover { opacity: 0.9; transform: translateY(-2px); }
    button:disabled { background: #bdbdbd; cursor: not-allowed; transform: none; }
    
    /* 섹션별 스타일 */
    .hidden { display: none !important; }
    .auth-box { max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .btn-login { background: #1976d2; color: white; }
    .btn-signup { background: #ffb300; color: #333; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #f5f5f5; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
    .btn-logout { background: #757575; color: white; padding: 8px 15px; }
    
    .ai-section { background: #e3f2fd; padding: 24px; border-radius: 15px; margin-bottom: 24px; border: 1px solid #90caf9; }
    .ai-controls { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn-ask { background: #d32f2f; color: white; white-space: nowrap; width: 140px; }
    .ai-response { background: white; padding: 20px; border-radius: 10px; min-height: 100px; margin-bottom: 15px; white-space: pre-wrap; line-height: 1.6; border: 1px solid #e0e0e0; }
    .btn-tts { background: #2e7d32; color: white; width: 100%; font-size: 16px; }

    .db-section { background: #f5f5f5; padding: 24px; border-radius: 15px; border: 1px solid #e0e0e0; }
    .db-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .btn-save { background: #1976d2; color: white; }
    
    .note-list { display: flex; flex-direction: column; gap: 12px; }
    .note-item { background: white; padding: 18px; border-radius: 10px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .note-content h3 { margin: 0 0 8px; color: #1565c0; font-size: 17px; }
    .note-content p { margin: 0; font-size: 14px; color: #444; line-height: 1.5; white-space: pre-wrap; }
    .btn-delete { background: #d32f2f; color: white; padding: 8px 14px; font-size: 13px; border-radius: 8px; }
    
    @media (max-width: 600px) {
      .ai-controls { flex-direction: column; }
      .btn-ask { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚑 AI 응급처치 도우미</h1>
    <div class="subtitle">다친 부위를 말하면 AI가 적절한 대처법을 알려주고, 내 치료 기록을 관리합니다.</div>

    <div class="warning-notice">
      <strong>🚨 주의사항:</strong> 본 AI의 안내는 참고용 응급처치 정보입니다. 심한 출혈, 골절 의심, 호흡 곤란 등 심각한 상황일 경우 <strong>즉시 119에 신고하거나 응급실을 방문</strong>하세요.
    </div>

    <div id="authSection" class="auth-box">
      <input id="emailInput" type="email" placeholder="이메일 (예: user@firstaid.com)" />
      <input id="pwInput" type="password" placeholder="비밀번호 6자리 이상" />
      <button id="loginBtn" class="btn-login">로그인</button>
      <button id="signupBtn" class="btn-signup">새로 가입하기</button>
    </div>

    <div id="mainSection" class="hidden">
      <div class="top-bar">
        <span>환영합니다! <strong><span id="userEmail"></span></strong>님</span>
        <button id="logoutBtn" class="btn-logout">로그아웃</button>
      </div>

      <div class="ai-section">
        <h2 style="margin-top: 0; color: #1565c0;">🩺 어디를, 어떻게 다치셨나요?</h2>
        <div class="ai-controls">
          <input id="questionInput" type="text" placeholder="예: 요리하다가 칼에 손가락을 살짝 베였어요. 피가 나요." />
          <button id="askBtn" class="btn-ask">처치법 묻기</button>
        </div>
        <div id="aiResponse" class="ai-response">증상을 입력하고 버튼을 누르면 AI 구조사가 대처법을 안내해 드립니다.</div>
        <button id="ttsBtn" class="btn-tts hidden">🔊 음성으로 안내 듣기 (TTS)</button>
      </div>

      <div class="db-section">
        <h2 style="margin-top: 0; color: #424242;">📂 내 부상 및 치료 기록 저장</h2>
        <div class="db-form">
          <input id="noteTitle" type="text" placeholder="기록 제목 (예: 24년 6월 손가락 베임)" />
          <textarea id="noteContent" rows="4" placeholder="AI가 알려준 처치법이나, 이후 병원 방문 결과 등을 메모해 두세요."></textarea>
          <button id="saveBtn" class="btn-save">데이터베이스에 기록 저장하기</button>
        </div>
        
        <h3 style="color: #424242;">📋 이전 치료 기록 목록</h3>
        <div id="noteList" class="note-list"></div>
      </div>
    </div>
  </div>

  <script type="module">
    // Firebase 라이브러리 불러오기
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, push, set, remove, onValue } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // 🚨 새롭게 제공해주신 OpenAI API 키 적용 완료
    const OPENAI_API_KEY = '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';
    
    const firebaseConfig = {
      apiKey: "AIzaSyDG0mCIRagrO1vMeHjD3o2070KJ2zjwZtw",
      authDomain: "test-3cb15.firebaseapp.com",
      databaseURL: "https://test-3cb15-default-rtdb.firebaseio.com",
      projectId: "test-3cb15",
      storageBucket: "test-3cb15.firebasestorage.app",
      messagingSenderId: "754947524586",
      appId: "1:754947524586:web:28bc76b444a9e60020d493"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;

    // --- DOM 요소 ---
    const authSection = document.getElementById('authSection'), mainSection = document.getElementById('mainSection');
    const emailInput = document.getElementById('emailInput'), pwInput = document.getElementById('pwInput');
    const loginBtn = document.getElementById('loginBtn'), signupBtn = document.getElementById('signupBtn'), logoutBtn = document.getElementById('logoutBtn');
    
    const questionInput = document.getElementById('questionInput');
    const askBtn = document.getElementById('askBtn'), aiResponse = document.getElementById('aiResponse'), ttsBtn = document.getElementById('ttsBtn');
    
    const noteTitle = document.getElementById('noteTitle'), noteContent = document.getElementById('noteContent');
    const saveBtn = document.getElementById('saveBtn'), noteList = document.getElementById('noteList');

    // --- 1. 로그인/회원가입 ---
    signupBtn.onclick = () => createUserWithEmailAndPassword(auth, emailInput.value, pwInput.value).then(() => alert("가입이 완료되었습니다!")).catch(e => alert(e.message));
    loginBtn.onclick = () => signInWithEmailAndPassword(auth, emailInput.value, pwInput.value).catch(e => alert("로그인 실패: 정보를 확인해주세요."));
    logoutBtn.onclick = () => signOut(auth);

    onAuthStateChanged(auth, user => {
      if (user) {
        currentUser = user;
        document.getElementById('userEmail').innerText = user.email;
        authSection.classList.add('hidden');
        mainSection.classList.remove('hidden');
        loadNotes();
      } else {
        currentUser = null;
        authSection.classList.remove('hidden');
        mainSection.classList.add('hidden');
      }
    });

    // --- 2. 생성형 AI 연동 ---
    askBtn.onclick = async () => {
      const question = questionInput.value.trim();
      if (!question) return alert("어디를 다치셨는지 증상을 입력해주세요!");

      askBtn.disabled = true; askBtn.innerText = "분석 중...";
      aiResponse.innerText = "상황을 파악하고 안전한 응급처치법을 찾고 있습니다. 잠시만 기다려주세요...";
      ttsBtn.classList.add('hidden');

      // AI의 역할과 성격을 부여하는 프롬프트 (전문적, 침착함, 경고 포함)
      const systemPrompt = `당신은 침착하고 전문적인 AI 응급구조사입니다. 사용자가 다친 부위와 상황을 말하면, 집에서 할 수 있는 안전하고 정확한 응급처치 방법을 이해하기 쉽게 1, 2, 3 단계별로 안내해 주세요. 단, 증상이 심각할 수 있는 경우 반드시 즉시 병원에 가거나 119에 신고하라는 경고를 포함해야 합니다.`;

      try {
        const res = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${OPENAI_API_KEY}` },
          body: JSON.stringify({
            model: "gpt-3.5-turbo",
            messages: [{ role: "system", content: systemPrompt }, { role: "user", content: question }]
          })
        });
        const data = await res.json();
        const answer = data.choices[0].message.content;
        
        aiResponse.innerText = answer;
        ttsBtn.classList.remove('hidden'); 
        
        // 메모장에 자동 세팅
        noteTitle.value = `[부상 기록] ${question}`;
        noteContent.value = `[AI 권장 처치법]\n${answer}`;
      } catch (err) {
        aiResponse.innerText = "통신 중 오류가 발생했습니다. 위급 상황일 경우 119에 바로 연락하세요.";
      } finally {
        askBtn.disabled = false; askBtn.innerText = "처치법 묻기";
      }
    };

    // --- 3. Web Speech API (TTS) ---
    ttsBtn.onclick = () => {
      const text = aiResponse.innerText;
      if (!text || !window.speechSynthesis) return;
      
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = 1.0; // 명확하고 또렷하게 들리도록 기본 속도 유지
      
      window.speechSynthesis.speak(utterance);
    };

    // --- 4. Firebase DB (기록 저장 및 조회) ---
    saveBtn.onclick = () => {
      if (!noteTitle.value || !noteContent.value) return alert("제목과 내용을 모두 입력하세요.");
      const dbRef = ref(db, `medical_notes/${currentUser.uid}`);
      push(dbRef, {
        title: noteTitle.value,
        content: noteContent.value,
        date: new Date().toLocaleString('ko-KR')
      }).then(() => {
        noteTitle.value = ""; noteContent.value = "";
        alert("치료 기록이 안전하게 저장되었습니다.");
      });
    };

    function loadNotes() {
      const dbRef = ref(db, `medical_notes/${currentUser.uid}`);
      onValue(dbRef, snapshot => {
        noteList.innerHTML = '';
        const data = snapshot.val();
        if (!data) {
          noteList.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">저장된 기록이 없습니다.</p>';
          return;
        }
        // 최신순으로 정렬
        Object.keys(data).reverse().forEach(key => {
          const note = data[key];
          const div = document.createElement('div');
          div.className = 'note-item';
          div.innerHTML = `
            <div class="note-content">
              <h3>${note.title}</h3>
              <p>${note.content}</p>
              <small style="color:#888; display:block; margin-top:10px;">저장일시: ${note.date}</small>
            </div>
            <button class="btn-delete" data-key="${key}">삭제</button>
          `;
          noteList.appendChild(div);
        });

        document.querySelectorAll('.btn-delete').forEach(btn => {
          btn.onclick = (e) => {
            const key = e.target.getAttribute('data-key');
            if(confirm("이 기록을 삭제하시겠습니까?")) remove(ref(db, `medical_notes/${currentUser.uid}/${key}`));
          };
        });
      });
    }

    // 엔터키 지원
    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') askBtn.click();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리집 안전 도우미</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: 'Malgun Gothic', sans-serif;
      color: #333;
    }

    .container {
      width: min(900px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 32px;
      color: #1565c0;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
      font-size: 15px;
    }

    .section-title {
      font-size: 20px;
      margin-bottom: 12px;
      color: #37474f;
      border-bottom: 2px solid #e3f2fd;
      padding-bottom: 8px;
    }

    /* 공통 요소 */
    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #42a5f5;
      box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15);
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      height: 46px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.15s;
      font-weight: bold;
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button:hover { transform: translateY(-2px); opacity: 0.9; }
    button:disabled { cursor: not-allowed; opacity: 0.6; transform: none; }

    /* 버튼 색상 */
    .btn-primary { background: #42a5f5; }
    .btn-secondary { background: #7e57c2; }
    .btn-success { background: #66bb6a; }
    .btn-danger { background: #ef5350; }
    .btn-warning { background: #ffca28; color: #333; }
    .btn-dark { background: #455a64; }
    .btn-light { background: #b0bec5; }

    .hidden { display: none !important; }
    .status { min-height: 24px; color: #555; font-size: 14px; margin: 8px 0; }
    .card { background: #f7f9fb; border: 1px solid #edf1f5; border-radius: 16px; padding: 18px; margin-bottom: 24px; }
    .flex-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .flex-end { justify-content: flex-end; }
    
    /* 레이아웃 관련 */
    .auth-box { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; background: #e3f2fd; padding: 14px 20px; border-radius: 16px; margin-bottom: 24px; font-weight: bold;}
    
    /* 게시판 리스트 */
    .item { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 16px; border-radius: 16px; background: #fff; border: 1px solid #ddd; margin-bottom: 10px;}
    .item-title { margin: 0 0 6px; font-size: 18px; font-weight: bold; }
    .item-content { margin: 0; color: #555; line-height: 1.5; word-break: break-all; }
    .item-date { margin-top: 8px; font-size: 12px; color: #999; }
    .empty { text-align: center; padding: 30px; color: #888; background: #f7f9fb; border-radius: 16px; }

    @media (max-width: 700px) {
      .item { grid-template-columns: 1fr; }
      .flex-row { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛡️ 우리집 안전 도우미</h1>
    <div class="subtitle">안전 점검 기록부터 AI 상담, 안내 방송까지 한 번에!</div>

    <section id="authSection">
      <div class="card auth-box">
        <h2 class="section-title" style="text-align:center; border:none;">서비스 시작하기</h2>
        <input id="emailInput" type="email" placeholder="이메일 (예: user@home.com)" />
        <input id="passwordInput" type="password" placeholder="비밀번호 (6자리 이상)" />
        <button class="btn-primary" id="loginBtn">로그인</button>
        <button class="btn-secondary" id="signupBtn">회원가입</button>
      </div>
    </section>

    <section id="mainSection" class="hidden">
      <div class="top-bar">
        <span>👤 접속 중: <span id="userEmail" style="color:#1565c0;"></span></span>
        <button class="btn-dark" style="height:36px; padding:0 12px;" id="logoutBtn">로그아웃</button>
      </div>

      <div class="card">
        <h2 class="section-title">📝 안전 점검 기록장</h2>
        <div class="flex-row" style="margin-bottom: 10px;">
          <input id="titleInput" type="text" placeholder="점검 항목 (예: 가스 밸브 확인)" style="flex: 1;" />
          <input id="contentInput" type="text" placeholder="상태 내용 (예: 이상 없음)" style="flex: 2;" />
          <button class="btn-primary" id="addBtn">기록 추가</button>
        </div>
        <div class="flex-row flex-end">
          <button class="btn-success" style="height:36px;" id="refreshBtn">새로고침</button>
        </div>
        <div id="dbStatus" class="status"></div>
        <div id="dataList"></div>
      </div>

      <div class="card">
        <h2 class="section-title">🤖 AI 안전 상담소</h2>
        <p style="font-size:13px; color:#555; margin-top:0;">안전 수칙이나 궁금한 점을 AI에게 물어보세요!</p>
        <textarea id="chatInput" placeholder="질문을 입력하세요. (예: 지진 발생 시 행동 요령을 알려줘)"></textarea>
        <div class="flex-row flex-end" style="margin-top:10px;">
          <button class="btn-light" id="chatClearBtn">초기화</button>
          <button class="btn-primary" id="chatAskBtn">질문하기</button>
        </div>
        <div id="chatStatus" class="status"></div>
        <div class="card" style="background:#fff; min-height:100px; white-space:pre-wrap;" id="chatAnswerBox">아직 답변이 없습니다.</div>
      </div>

      <div class="card">
        <h2 class="section-title">📢 긴급 안내 방송 생성 (TTS)</h2>
        <div class="flex-row" style="margin-bottom:10px;">
          <select id="ttsModel" style="flex:1;">
            <option value="tts-1">빠른 생성 (tts-1)</option>
            <option value="tts-1-hd">고품질 (tts-1-hd)</option>
          </select>
          <select id="ttsVoice" style="flex:1;">
            <option value="alloy">음성1 (alloy)</option>
            <option value="echo">음성2 (echo)</option>
            <option value="fable">음성3 (fable)</option>
          </select>
          <input id="ttsSpeed" type="number" min="0.5" max="2.0" step="0.1" value="1.0" placeholder="속도" style="flex:0.5;" />
        </div>
        <textarea id="ttsInput" placeholder="방송할 내용을 입력하세요. (예: 아아, 안내 말씀 드립니다. 현재 화재 경보기가 작동했습니다.)" style="min-height:80px;"></textarea>
        <div class="flex-row flex-end" style="margin-top:10px;">
          <button class="btn-primary" id="ttsMakeBtn">음성 파일 만들기</button>
        </div>
        <div id="ttsStatus" class="status"></div>
        
        <div id="ttsResultBox" class="hidden" style="margin-top:15px; padding-top:15px; border-top:1px dashed #ccc;">
          <audio id="ttsAudio" controls style="width:100%;"></audio>
          <div class="flex-row flex-end" style="margin-top:10px;">
            <a id="ttsDownload" class="btn-secondary" href="#" download="safety-alert.mp3" style="text-decoration:none;">💾 mp3 다운로드</a>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script type="module">
    // [1] Firebase 초기화
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, push, set, update, remove, onValue, off } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDG0mCIRagrO1vMeHjD3o2070KJ2zjwZtw",
      authDomain: "test-3cb15.firebaseapp.com",
      databaseURL: "https://test-3cb15-default-rtdb.firebaseio.com",
      projectId: "test-3cb15",
      storageBucket: "test-3cb15.firebasestorage.app",
      messagingSenderId: "754947524586",
      appId: "1:754947524586:web:28bc76b444a9e60020d493",
      measurementId: "G-SZQDCGTLGY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // [2] 전역 변수 및 DOM 선택
    let currentUser = null;
    let currentItemsRef = null;

    // UI 섹션
    const authSection = document.getElementById('authSection');
    const mainSection = document.getElementById('mainSection');
    
    // Auth UI
    const userEmailText = document.getElementById('userEmail');
    document.getElementById('signupBtn').addEventListener('click', handleAuth('signup'));
    document.getElementById('loginBtn').addEventListener('click', handleAuth('login'));
    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

    // Firebase DB UI
    document.getElementById('addBtn').addEventListener('click', addDbData);
    document.getElementById('refreshBtn').addEventListener('click', () => startRealtimeDataListener(currentUser.uid));
    
    // ChatGPT Q&A UI
    const CHAT_API_URL = 'https://script.google.com/macros/s/AKfycbwI6HO04AL_jkwU1KeO4p4_QB_ODXL2Y8qlfgwEWNoR56y2iLsBPAeMSvxrumuD0Mky/exec';
    document.getElementById('chatAskBtn').addEventListener('click', askChat);
    document.getElementById('chatClearBtn').addEventListener('click', () => {
      document.getElementById('chatInput').value = '';
      document.getElementById('chatAnswerBox').textContent = '아직 답변이 없습니다.';
      document.getElementById('chatStatus').textContent = '';
    });

    // TTS UI
    const TTS_API_URL = 'https://script.google.com/macros/s/AKfycbwI6HO04AL_jkwU1KeO4p4_QB_ODXL2Y8qlfgwEWNoR56y2iLsBPAeMSvxrumuD0Mky/exec';
    document.getElementById('ttsMakeBtn').addEventListener('click', makeTts);


    // [3] 로그인 / 회원가입 로직
    function handleAuth(type) {
      return async () => {
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();
        if (!email || password.length < 6) return alert('이메일과 6자리 이상 비밀번호를 입력하세요.');
        try {
          if (type === 'signup') await createUserWithEmailAndPassword(auth, email, password);
          else await signInWithEmailAndPassword(auth, email, password);
        } catch (error) { alert('오류: ' + error.message); }
      };
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authSection.classList.add('hidden');
        mainSection.classList.remove('hidden');
        userEmailText.textContent = user.email;
        startRealtimeDataListener(user.uid);
      } else {
        currentUser = null;
        authSection.classList.remove('hidden');
        mainSection.classList.add('hidden');
        if(currentItemsRef) off(currentItemsRef);
      }
    });

    // [4] Firebase Database (안전 기록장) 로직
    function startRealtimeDataListener(uid) {
      if (currentItemsRef) off(currentItemsRef);
      currentItemsRef = ref(database, `users/${uid}/safety_logs`);
      onValue(currentItemsRef, (snapshot) => {
        renderDbData(snapshot.val());
        document.getElementById('dbStatus').textContent = '기록이 동기화되었습니다. (' + new Date().toLocaleTimeString() + ')';
      });
    }

    async function addDbData() {
      const title = document.getElementById('titleInput').value.trim();
      const content = document.getElementById('contentInput').value.trim();
      if (!title || !content) return alert('항목과 상태를 모두 입력해주세요.');
      
      const newRef = push(ref(database, `users/${currentUser.uid}/safety_logs`));
      await set(newRef, { title, content, createdAt: new Date().toLocaleString('ko-KR') });
      document.getElementById('titleInput').value = '';
      document.getElementById('contentInput').value = '';
    }

    window.deleteDbData = async (id) => {
      if (confirm('이 기록을 삭제할까요?')) {
        await remove(ref(database, `users/${currentUser.uid}/safety_logs/${id}`));
      }
    };

    function renderDbData(data) {
      const list = document.getElementById('dataList');
      list.innerHTML = '';
      if (!data) return list.innerHTML = '<div class="empty">안전 점검 기록이 없습니다.</div>';
      
      Object.entries(data).reverse().forEach(([id, item]) => {
        list.innerHTML += `
          <div class="item">
            <div>
              <p class="item-title">✔️ ${item.title.replaceAll('<', '&lt;')}</p>
              <p class="item-content">${item.content.replaceAll('<', '&lt;')}</p>
              <p class="item-date">${item.createdAt}</p>
            </div>
            <button class="btn-danger" onclick="deleteDbData('${id}')">삭제</button>
          </div>
        `;
      });
    }

    // [5] ChatGPT 질문 답변 로직 (에러 감지 및 예외 처리 강화)
    async function askChat() {
      const input = document.getElementById('chatInput');
      const answerBox = document.getElementById('chatAnswerBox');
      const statusBox = document.getElementById('chatStatus');
      const btn = document.getElementById('chatAskBtn');
      
      if (!input.value.trim()) return alert('질문을 입력해주세요.');
      
      btn.disabled = true;
      btn.textContent = '답변 생성 중...';
      answerBox.textContent = '인공지능이 답변을 작성하고 있습니다... ⏳';
      statusBox.textContent = '서버에 요청을 보내는 중입니다.';

      try {
        const res = await fetch(CHAT_API_URL, { 
          method: 'POST', 
          body: JSON.stringify({ question: input.value }) 
        });
        
        const data = await res.json();
        
        // 서버 측에서 자체 에러 객체를 실어 보냈는지 판단
        if (data.error) {
          throw new Error(data.error);
        }
        
        answerBox.textContent = data.answer || '답변을 가져오지 못했습니다.';
        statusBox.textContent = '답변 생성 완료';
      } catch (err) {
        console.error('Chat API 오류:', err);
        answerBox.textContent = '오류가 발생했습니다.\n\n' + err.message;
        statusBox.textContent = '요청 실패';
      } finally {
        btn.disabled = false;
        btn.textContent = '질문하기';
      }
    }

    // [6] TTS 안내 방송 로직 (에러 표시 로직 강화)
    async function makeTts() {
      const text = document.getElementById('ttsInput').value.trim();
      const model = document.getElementById('ttsModel').value;
      const voice = document.getElementById('ttsVoice').value;
      const speed = Number(document.getElementById('ttsSpeed').value);
      const btn = document.getElementById('ttsMakeBtn');
      const statusBox = document.getElementById('ttsStatus');
      const resultBox = document.getElementById('ttsResultBox');
      
      if (!text) return alert('안내 방송 내용을 입력해주세요.');
      
      btn.disabled = true;
      btn.textContent = '음성 생성 중...';
      statusBox.textContent = '서버에서 오디오 파일을 만들고 있습니다... 🎙️';
      resultBox.classList.add('hidden');

      try {
        const res = await fetch(TTS_API_URL, { 
          method: 'POST', 
          body: JSON.stringify({ type: 'tts', text, model, voice, speed }) 
        });
        const data = await res.json();
        
        if (data.error) throw new Error(data.error);
        if (!data.audioBase64) throw new Error('음성 데이터를 받지 못했습니다.');

        // Base64 -> Audio Blob URL 변환
        const byteChars = atob(data.audioBase64);
        const byteArrays = [];
        for (let i = 0; i < byteChars.length; i += 512) {
          const slice = byteChars.slice(i, i + 512);
          const byteNums = new Array(slice.length);
          for (let j = 0; j < slice.length; j++) byteNums[j] = slice.charCodeAt(j);
          byteArrays.push(new Uint8Array(byteNums));
        }
        const audioUrl = URL.createObjectURL(new Blob(byteArrays, { type: 'audio/mpeg' }));
        
        document.getElementById('ttsAudio').src = audioUrl;
        document.getElementById('ttsDownload').href = audioUrl;
        resultBox.classList.remove('hidden');
        statusBox.textContent = '음성 파일이 준비되었습니다!';
      } catch (err) {
        console.error('TTS API 오류:', err);
        statusBox.textContent = '요청 실패';
        alert('오류가 발생했습니다.\n\n' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '음성 파일 만들기';
      }
    }
  </script>
</body>
</html>

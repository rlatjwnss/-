<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 복지 상담 및 일지 관리</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f5e9, #fff9c4);
      font-family: 'Malgun Gothic', Arial, sans-serif;
      color: #333;
    }

    .container {
      width: min(900px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
      color: #2e7d32;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
      color: #388e3c;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
      font-size: 15px;
    }

    .auth-box {
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input, textarea {
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: #66bb6a;
      box-shadow: 0 0 0 3px rgba(102, 187, 106, 0.2);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      height: 46px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.15s;
      font-weight: bold;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .login-btn { background: #43a047; color: white; }
    .signup-btn { background: #fbc02d; color: #333; }
    .logout-btn { background: #757575; color: white; height: 38px; }
    .add-btn { background: #43a047; color: white; }
    .refresh-btn { background: #81c784; color: white; margin-bottom: 16px; }
    .edit-btn { background: #ffca28; color: #333; height: 36px; }
    .delete-btn { background: #ef5350; color: white; height: 36px; }
    .save-btn { background: #43a047; color: white; height: 36px; }
    .cancel-btn { background: #b0bec5; color: white; height: 36px; }

    /* AI 섹션 스타일 */
    .ai-box {
      background: #f1f8e9;
      border: 1px solid #c5e1a5;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .ai-input-group {
      display: flex;
      gap: 10px;
    }
    .ai-input-group input { flex: 1; }
    #askAiBtn { background: #2e7d32; color: white; }
    #ttsBtn { background: #ffa000; color: white; display: none; }
    .ai-response {
      background: white;
      padding: 16px;
      border-radius: 12px;
      min-height: 60px;
      white-space: pre-wrap;
      line-height: 1.5;
      border: 1px solid #e0e0e0;
    }

    .form-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
      background: #fafafa;
      padding: 16px;
      border-radius: 16px;
      border: 1px dashed #bdbdbd;
    }
    .form-box input { height: 46px; }
    .form-box textarea { resize: vertical; min-height: 80px; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      padding: 14px;
      border-radius: 16px;
      background: #f7f9fb;
    }

    .user-info { font-size: 14px; color: #555; word-break: break-all; }
    .status { min-height: 24px; margin-bottom: 14px; color: #555; font-size: 14px; }
    .list { display: flex; flex-direction: column; gap: 12px; }

    .item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 16px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid #e0e0e0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .item-title { margin: 0 0 6px; font-size: 18px; font-weight: bold; color: #2e7d32; }
    .item-content { margin: 0; color: #555; line-height: 1.5; word-break: break-all; white-space: pre-wrap;}
    .item-date { margin-top: 8px; font-size: 12px; color: #999; }
    .item-actions { display: flex; gap: 8px; }

    .edit-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    .edit-actions { display: flex; gap: 8px; justify-content: flex-end; }

    .empty { text-align: center; padding: 30px; color: #888; background: #f7f9fb; border-radius: 16px; }
    .hidden { display: none !important; }

    .notice {
      max-width: 620px;
      margin: 20px auto 0;
      padding: 14px;
      border-radius: 14px;
      background: #fff8e1;
      color: #6d4c41;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 700px) {
      .ai-input-group, .item { grid-template-columns: 1fr; flex-direction: column; align-items: stretch; }
      .item-actions { justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌱 AI 맞춤형 복지 상담소</h1>
    <div class="subtitle">따뜻한 AI 상담과 나만의 복지 기록을 관리하세요.</div>

    <section id="authSection">
      <div class="auth-box">
        <h2>로그인 / 회원가입</h2>
        <input id="emailInput" type="email" placeholder="이메일 (예: user@test.com)" />
        <input id="passwordInput" type="password" placeholder="비밀번호 6자리 이상" />
        <button class="login-btn" id="loginBtn">로그인</button>
        <button class="signup-btn" id="signupBtn">새로 가입하기</button>
      </div>

      <div class="notice">
        <strong>[안내]</strong><br />
        처음 오신 분은 '새로 가입하기'를 눌러 계정을 만들어주세요.<br />
        가입하신 분은 이메일과 비밀번호 입력 후 '로그인'을 누르시면 됩니다.
      </div>
    </section>

    <section id="mainSection" class="hidden">
      <div class="top-bar">
        <div class="user-info">
          접속 계정: <strong id="userEmail"></strong>
        </div>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>

      <div class="ai-box">
        <h2>💡 AI 복지사에게 물어보세요</h2>
        <div class="ai-input-group">
          <input id="aiInput" type="text" placeholder="예: 65세 이상 노인 교통비 지원 혜택이 있나요?" />
          <button id="askAiBtn">질문하기</button>
        </div>
        <div id="aiResponse" class="ai-response">AI의 답변이 이곳에 표시됩니다.</div>
        <button id="ttsBtn">🔊 음성으로 듣기 (TTS)</button>
      </div>

      <h2>📝 내 상담 일지 기록하기</h2>
      <div class="form-box">
        <input id="titleInput" type="text" placeholder="상담 제목 (AI 질문 시 자동 입력됨)" />
        <textarea id="contentInput" placeholder="상담 내용 또는 개인 메모 (AI 답변 시 자동 입력됨)"></textarea>
        <button class="add-btn" id="addBtn">DB에 기록 저장하기</button>
      </div>

      <button class="refresh-btn" id="refreshBtn">저장된 기록 새로고침</button>
      <div id="status" class="status"></div>
      <div id="dataList" class="list"></div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import {
      getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import {
      getDatabase, ref, push, set, update, remove, onValue, off
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    // OpenAI API 키 설정 완료
    const OPENAI_API_KEY = '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';

    const firebaseConfig = {
      apiKey: "AIzaSyDG0mCIRagrO1vMeHjD3o2070KJ2zjwZtw",
      authDomain: "test-3cb15.firebaseapp.com",
      databaseURL: "https://test-3cb15-default-rtdb.firebaseio.com",
      projectId: "test-3cb15",
      storageBucket: "test-3cb15.firebasestorage.app",
      messagingSenderId: "754947524586",
      appId: "1:754947524586:web:28bc76b444a9e60020d493",
      measurementId: "G-SZQDCGTLGY"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // DOM 요소들
    const authSection = document.getElementById('authSection');
    const mainSection = document.getElementById('mainSection');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userEmail = document.getElementById('userEmail');
    
    // AI 연동 요소
    const aiInput = document.getElementById('aiInput');
    const askAiBtn = document.getElementById('askAiBtn');
    const aiResponseBox = document.getElementById('aiResponse');
    const ttsBtn = document.getElementById('ttsBtn');

    // DB 연동 요소
    const titleInput = document.getElementById('titleInput');
    const contentInput = document.getElementById('contentInput');
    const addBtn = document.getElementById('addBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const dataList = document.getElementById('dataList');
    const statusBox = document.getElementById('status');

    let currentUser = null;
    let currentItemsRef = null;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    // --------------------------------------------------
    // 1. Firebase 로그인 / 회원가입 로직
    // --------------------------------------------------
    function getEmailAndPassword() {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      if (!email || !password) {
        alert('이메일과 비밀번호를 모두 입력해주세요.');
        return null;
      }
      if (password.length < 6) {
        alert('비밀번호는 6자리 이상이어야 합니다.');
        return null;
      }
      return { email, password };
    }

    signupBtn.addEventListener('click', async () => {
      const account = getEmailAndPassword();
      if (!account) return;
      try {
        await createUserWithEmailAndPassword(auth, account.email, account.password);
        alert('회원가입이 완료되었습니다.');
      } catch (error) {
        alert(getKoreanErrorMessage(error.code));
      }
    });

    loginBtn.addEventListener('click', async () => {
      const account = getEmailAndPassword();
      if (!account) return;
      try {
        await signInWithEmailAndPassword(auth, account.email, account.password);
      } catch (error) {
        alert(getKoreanErrorMessage(error.code));
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (error) {
        alert('로그아웃에 실패했습니다.');
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        showMainPage(user);
        startRealtimeDataListener(user.uid);
      } else {
        currentUser = null;
        showAuthPage();
        stopRealtimeDataListener();
      }
    });

    function showMainPage(user) {
      authSection.classList.add('hidden');
      mainSection.classList.remove('hidden');
      userEmail.textContent = user.email;
      emailInput.value = '';
      passwordInput.value = '';
    }

    function showAuthPage() {
      authSection.classList.remove('hidden');
      mainSection.classList.add('hidden');
      userEmail.textContent = '';
      dataList.innerHTML = '';
      aiResponseBox.textContent = 'AI의 답변이 이곳에 표시됩니다.';
      ttsBtn.style.display = 'none';
      window.speechSynthesis.cancel(); // 로그아웃 시 TTS 중지
    }

    // --------------------------------------------------
    // 2. OpenAI API 연동 및 TTS 기능
    // --------------------------------------------------
    askAiBtn.addEventListener('click', async () => {
      const question = aiInput.value.trim();
      if (!question) {
        alert("AI에게 물어볼 내용을 입력해주세요.");
        return;
      }

      if (OPENAI_API_KEY === 'YOUR_OPENAI_API_KEY') {
        alert("코드 내에 OPENAI API 키를 입력하셔야 합니다.");
        return;
      }

      askAiBtn.disabled = true;
      askAiBtn.textContent = "답변 중...";
      aiResponseBox.textContent = "AI 복지사가 답변을 생각하고 있습니다. 잠시만 기다려주세요...";
      ttsBtn.style.display = 'none';

      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${OPENAI_API_KEY}`
          },
          body: JSON.stringify({
            model: "gpt-3.5-turbo",
            messages: [
              { role: "system", content: "당신은 따뜻하고 전문적인 대한민국 사회복지사입니다. 어르신이나 사회적 약자가 이해하기 쉽도록 친절하고 명확하게 답변해 주세요." },
              { role: "user", content: question }
            ]
          })
        });

        if (!response.ok) throw new Error("API 요청 실패");

        const data = await response.json();
        const aiText = data.choices[0].message.content;

        aiResponseBox.textContent = aiText;
        ttsBtn.style.display = 'inline-block'; // TTS 버튼 보이기

        // 하단 DB 저장 폼에 내용 자동 세팅 (편의성)
        titleInput.value = `[AI 상담] ${question}`;
        contentInput.value = aiText;

      } catch (error) {
        console.error(error);
        aiResponseBox.textContent = "오류가 발생했습니다. API 키를 확인하시거나 잠시 후 다시 시도해주세요.";
      } finally {
        askAiBtn.disabled = false;
        askAiBtn.textContent = "질문하기";
      }
    });

    // TTS 음성 출력
    ttsBtn.addEventListener('click', () => {
      const textToRead = aiResponseBox.textContent;
      if (!textToRead || !window.speechSynthesis) return;

      window.speechSynthesis.cancel(); // 기존 음성 취소
      const utterance = new SpeechSynthesisUtterance(textToRead);
      utterance.lang = 'ko-KR';
      utterance.rate = 0.9; // 약간 천천히 읽기
      window.speechSynthesis.speak(utterance);
    });

    // --------------------------------------------------
    // 3. Firebase DB 연동 (기존 코드 유지 및 수정)
    // --------------------------------------------------
    function startRealtimeDataListener(uid) {
      stopRealtimeDataListener();
      setStatus('데이터를 불러오는 중입니다...');
      currentItemsRef = ref(database, `users/${uid}/items`);
      onValue(currentItemsRef, (snapshot) => {
        const data = snapshot.val();
        renderData(data);
        setStatus('기록이 실시간으로 동기화되었습니다.');
      }, (error) => {
        console.error(error);
        setStatus('데이터를 불러오지 못했습니다. Firebase 규칙을 확인하세요.');
      });
    }

    function stopRealtimeDataListener() {
      if (currentItemsRef) {
        off(currentItemsRef);
        currentItemsRef = null;
      }
    }

    addBtn.addEventListener('click', async () => {
      if (!currentUser) return;
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();

      if (!title || !content) {
        alert('제목과 내용을 모두 입력해주세요.');
        return;
      }

      try {
        const itemsRef = ref(database, `users/${currentUser.uid}/items`);
        const newItemRef = push(itemsRef);
        await set(newItemRef, {
          title, content,
          createdAt: new Date().toLocaleString('ko-KR'),
          updatedAt: ''
        });
        titleInput.value = '';
        contentInput.value = '';
        alert("일지가 안전하게 저장되었습니다.");
      } catch (error) {
        console.error(error);
        alert('데이터 추가에 실패했습니다.');
      }
    });

    refreshBtn.addEventListener('click', () => {
      if (currentUser) startRealtimeDataListener(currentUser.uid);
    });

    window.deleteData = async function(id) {
      if (!currentUser) return;
      if (!confirm('정말 삭제하시겠습니까?')) return;
      try {
        await remove(ref(database, `users/${currentUser.uid}/items/${id}`));
      } catch (error) {
        alert('데이터 삭제에 실패했습니다.');
      }
    };

    window.updateData = async function(id) {
      if (!currentUser) return;
      const editTitle = document.getElementById(`edit-title-${id}`).value.trim();
      const editContent = document.getElementById(`edit-content-${id}`).value.trim();
      if (!editTitle || !editContent) {
        alert('수정할 내용을 모두 입력해주세요.');
        return;
      }
      try {
        await update(ref(database, `users/${currentUser.uid}/items/${id}`), {
          title: editTitle, content: editContent,
          updatedAt: new Date().toLocaleString('ko-KR')
        });
      } catch (error) {
        alert('데이터 수정에 실패했습니다.');
      }
    };

    function renderData(data) {
      dataList.innerHTML = '';
      if (!data) {
        dataList.innerHTML = '<div class="empty">아직 저장된 상담 일지가 없습니다.</div>';
        return;
      }
      const entries = Object.entries(data).reverse(); // 최신순 정렬
      entries.forEach(([id, item]) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.id = `item-${id}`;
        div.innerHTML = `
          <div>
            <p class="item-title">${escapeHTML(item.title || '')}</p>
            <p class="item-content">${escapeHTML(item.content || '')}</p>
            <div class="item-date">
              생성: ${item.createdAt || '-'} ${item.updatedAt ? ` / 수정: ${item.updatedAt}` : ''}
            </div>
          </div>
          <div class="item-actions">
            <button class="edit-btn" onclick="showEditForm('${id}', '${escapeForAttribute(item.title || '')}', '${escapeForAttribute(item.content || '')}')">수정</button>
            <button class="delete-btn" onclick="deleteData('${id}')">삭제</button>
          </div>
        `;
        dataList.appendChild(div);
      });
    }

    window.showEditForm = function(id, title, content) {
      const itemBox = document.getElementById(`item-${id}`);
      itemBox.innerHTML = `
        <div class="edit-box">
          <input id="edit-title-${id}" type="text" value="${title}" />
          <textarea id="edit-content-${id}">${content}</textarea>
          <div class="edit-actions">
            <button class="save-btn" onclick="updateData('${id}')">저장</button>
            <button class="cancel-btn" onclick="startRealtimeDataListener(currentUser.uid)">취소</button>
          </div>
        </div>
      `;
    };

    function escapeHTML(text) {
      return String(text).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }
    function escapeForAttribute(text) {
      return escapeHTML(text).replaceAll('`', '&#096;');
    }

    function getKoreanErrorMessage(code) {
      switch (code) {
        case 'auth/email-already-in-use': return '이미 가입된 이메일입니다.';
        case 'auth/invalid-email': return '이메일 형식이 올바르지 않습니다.';
        case 'auth/weak-password': return '비밀번호가 너무 약합니다. 6자리 이상으로 입력해주세요.';
        case 'auth/user-not-found': return '가입되지 않은 이메일입니다.';
        case 'auth/wrong-password': return '비밀번호가 올바르지 않습니다.';
        case 'auth/invalid-credential': return '이메일 또는 비밀번호가 올바르지 않습니다.';
        default: return `오류가 발생했습니다: ${code}`;
      }
    }

    // 엔터키 지원 (로그인 시)
    document.addEventListener('keydown', function(event) {
      if (event.key !== 'Enter') return;
      const activeId = document.activeElement.id;
      if (activeId === 'emailInput' || activeId === 'passwordInput') loginBtn.click();
      if (activeId === 'aiInput') askAiBtn.click();
    });
  </script>
</body>
</html>
